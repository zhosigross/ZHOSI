/* ---- COUNTDOWN ---- */
#count{position:relative;z-index:10;margin-top:-1vmin;display:flex;gap:clamp(14px,4vmin,36px);justify-content:center;color:#fff;
  font-family:'DotMatrix',monospace;text-transform:uppercase;text-align:center;user-select:none}
#count div{min-width:2.2ch}
#count b{display:block;font-weight:400;font-size:clamp(26px,6.5vmin,54px);line-height:1.1;letter-spacing:.1em;font-variant-numeric:tabular-nums}
#count span{display:block;margin-top:4px;font-size:clamp(9px,1.7vmin,13px);letter-spacing:.2em;color:rgba(255,255,255,.7)}

#tag{position:relative;z-index:10;flex:none;height:0;width:100%}
#tag span{position:absolute;left:50%;top:2.4vmin;transform:translateX(-50%);width:min(90vw,640px);text-align:center;color:rgba(255,255,255,.85);font-family:'DotMatrix',monospace;font-size:clamp(11px,2vmin,16px);letter-spacing:.08em;line-height:1.5;user-select:none}

/* ---- INTRO ---- */
#intro{display:none;position:fixed;inset:0;z-index:9999;background:#fff;opacity:1;transition:opacity .9s ease}
html.intro #intro{display:block}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
#intro.out{opacity:0;pointer-events:none}
html.intro,html.intro body{overflow:hidden}
@media(prefers-reduced-motion:reduce){#intro,#stage{transition-duration:.01s}}
</style>
<script>document.documentElement.classList.add("intro");</script>

<script>
/* intro */
(function(){
  var root=document.documentElement,intro=document.getElementById("intro"),
      stage=document.getElementById("stage"),v=document.getElementById("introVideo"),finished=false;
  function finish(){
    if(finished)return;finished=true;
    intro.classList.add("out");     // intro fades out
    stage.classList.add("show");    // logo fades in
    setTimeout(function(){root.classList.remove("intro");intro.remove();},1000);
  }
  var portrait=window.matchMedia("(orientation: portrait)").matches||window.innerWidth<=700;
  v.src=portrait?"zhosi-intro-mobile.mp4":"zhosi-intro-desktop.mp4";
  v.addEventListener("ended",finish);
  v.addEventListener("error",finish);
  var p=v.play();
  if(p&&p.catch)p.catch(finish);
  setTimeout(finish,8000);
})();

/* 3D tilt follows the pointer */
(function(){
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var logo=document.getElementById("logo");
  var MAX=28;                         // max tilt in degrees
  var tx=0,ty=0,cx=0,cy=0;            // target / current (-1..1)
  function aim(x,y){
    tx=(x/window.innerWidth)*2-1;
    ty=(y/window.innerHeight)*2-1;
  }
  var gyro=false,base=null;
  // mouse always works; touch-drag is ignored once the gyro is active
  window.addEventListener("pointermove",function(e){
    if(gyro&&e.pointerType!=="mouse")return;
    aim(e.clientX,e.clientY);
  });
  window.addEventListener("pointerleave",function(){if(!gyro){tx=0;ty=0;}});
  document.addEventListener("mouseleave",function(){if(!gyro){tx=0;ty=0;}});

  // phone tilt (gyro): neutral = however you're holding it at the start
  function onOrient(e){
    if(e.beta==null||e.gamma==null)return;
    var a=(screen.orientation&&screen.orientation.angle)||window.orientation||0,x,y;
    if(a===90){x=e.beta;y=-e.gamma;}
    else if(a===-90||a===270){x=-e.beta;y=e.gamma;}
    else if(a===180){x=-e.gamma;y=-e.beta;}
    else{x=e.gamma;y=e.beta;}
    if(!base||base.a!==a)base={a:a,x:x,y:y};
    var R=28;                                   // degrees of phone tilt for full effect
    tx=Math.max(-1,Math.min(1,(x-base.x)/R));
    ty=Math.max(-1,Math.min(1,(y-base.y)/R));
    base.x+=(x-base.x)*0.004; base.y+=(y-base.y)*0.004;   // slowly re-centres
    gyro=true;
  }
  function startGyro(){window.addEventListener("deviceorientation",onOrient);}
  var DOE=window.DeviceOrientationEvent;
  if(DOE&&typeof DOE.requestPermission==="function"){
    // iOS: needs a tap to allow motion access
    var asked=false;
    function ask(){
      if(asked)return;asked=true;
      DOE.requestPermission().then(function(s){if(s==="granted")startGyro();}).catch(function(){});
    }
    window.addEventListener("touchend",ask,{once:true});
    window.addEventListener("click",ask,{once:true});
  }else if(DOE){
    startGyro();                                // Android and others
  }
  (function loop(){
    cx+=(tx-cx)*0.08; cy+=(ty-cy)*0.08;   // smooth easing
    var rY= cx*MAX, rX=-cy*MAX, rZ=cx*4;
    logo.style.transform=
      "rotateX("+rX.toFixed(2)+"deg) rotateY("+rY.toFixed(2)+"deg) rotateZ("+rZ.toFixed(2)+"deg) translateZ(40px)";
    // light follows the pointer; streak sweeps across as it tilts
    logo.style.setProperty("--gx",(50+cx*45).toFixed(1)+"%");
    logo.style.setProperty("--gy",(50+cy*45).toFixed(1)+"%");
    logo.style.setProperty("--sx",(50+cx*55-cy*15).toFixed(1)+"%");
    logo.style.setProperty("--gi",(0.45+Math.min(1,Math.hypot(cx,cy))*0.55).toFixed(2));
    requestAnimationFrame(loop);
  })();
})();

/* countdown to 1 Jan 2027 */
(function(){
  var T=new Date(2027,0,1,0,0,0).getTime(),
      el={d:document.getElementById("cd"),h:document.getElementById("ch"),m:document.getElementById("cm"),s:document.getElementById("cs")};
  function p(n){return n<10?"0"+n:""+n;}
  function tick(){
    var s=Math.max(0,Math.floor((T-Date.now())/1000));
    el.d.textContent=p(Math.floor(s/86400));
    el.h.textContent=p(Math.floor(s%86400/3600));
    el.m.textContent=p(Math.floor(s%3600/60));
    el.s.textContent=p(s%60);
  }
  tick();setInterval(tick,1000);
})();
